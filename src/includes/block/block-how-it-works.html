<section class="block-how-it-works  @@bgColorClass">
    <div id="how-it-works"  class="anchor"></div>
    <div class="container">
        <p class="title">@@title</p>
        <div class="items-container">
            <div class="item">
                <picture>
                    <source srcset="@@item1.iconWebpURL" type="image/webp">
                    <img class="item-icon" src="@@item1.iconURL" alt="Icon" width="100" height="100">
                </picture>
                <p class="item-title">@@item1.title</p>
                <p class="item-text">@@item1.description</p>
            </div>
            <div class="item">
                <picture>
                    <source srcset="@@item2.iconWebpURL" type="image/webp">
                    <img class="item-icon" src="@@item2.iconURL" alt="Icon" width="100" height="100">
                </picture>
                <p class="item-title">@@item2.title</p>
                <p class="item-text">@@item2.description</p>
            </div>
            <div class="item">
                <picture>
                    <source srcset="@@item3.iconWebpURL" type="image/webp">
                    <img class="item-icon" src="@@item3.iconURL" alt="Icon" width="100" height="100">
                </picture>
                <p class="item-title">@@item3.title</p>
                <p class="item-text">@@item3.description</p>
            </div>
        </div>
    </div>
</section>

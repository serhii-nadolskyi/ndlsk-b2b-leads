<section class="block-3-blocks @@bgColorClass">
  <div class="container">
    <!-- Title -->
    <p class="title">@@title</p>
    <!-- All Items -->
    <div class="items">
      <!-- Item -->
      <div class="item">
        <div class="item__column">
          <picture>
            <source srcset="@@item1.iconWebpURL" type="image/webp">
            <img class="item__icon" src="@@item1.iconURL" alt="Icon" width="150" height="150">
          </picture>
        </div>
        <div class="item__column">
          <div class="item__title">@@item1.title</div>
          <div class="item__description">@@item1.description</div>
        </div>
      </div>
      <!-- Item -->
      <div class="item">
        <div class="item__column">
          <picture>
            <source srcset="@@item2.iconWebpURL" type="image/webp">
            <img class="item__icon" src="@@item2.iconURL" alt="Icon" width="150" height="150">
          </picture>
        </div>
        <div class="item__column">
          <div class="item__title">@@item2.title</div>
          <div class="item__description">@@item2.description</div>
        </div>
      </div>
      <!-- Item -->
      <div class="item">
        <div class="item__column">
          <picture>
            <source srcset="@@item3.iconWebpURL" type="image/webp">
            <img class="item__icon" src="@@item3.iconURL" alt="Icon" width="150" height="150">
          </picture>
        </div>
        <div class="item__column">
          <div class="item__title">@@item3.title</div>
          <div class="item__description">@@item3.description</div>
        </div>
      </div>
    </div>
  </div>
</section>

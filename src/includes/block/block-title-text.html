<section class="block-title-text-1-button @@bgColorClass @@columns">
  <div class="container">
    <div class="text-container">
      <p class="title">@@title</p>
      <p class="description">@@text</p>
    </div>
    <div class="social">
      <a class="social_link" href="@@social1.url" target="_blank" rel="noopener noreferrer">
        <img
          class="social_logo__icon"
          src="@@social1.icon"
          alt="@@social1.name Icon"
          width="512"
          height="512"
        />
        <p class="h4">@@social1.name</p>
      </a>
      <a class="social_link" href="@@social2.url" target="_blank" rel="noopener noreferrer">
        <img
          class="social_logo__icon"
          src="@@social2.icon"
          alt="@@social2.name Icon"
          width="512"
          height="512"
        />
        <p class="h4">@@social2.name</p>
      </a>
      <a class="social_link" href="@@social3.url" target="_blank" rel="noopener noreferrer">
        <img
          class="social_logo__icon"
          src="@@social3.icon"
          alt="@@social3.name Icon"
          width="512"
          height="512"
        />
        <p class="h4">@@social3.name</p>
      </a>
    </div>
  </div>
</section>

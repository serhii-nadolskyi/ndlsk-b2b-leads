<section class="block-text-image @@bgColorClass">
  <div class="container">
    <div class="text-container">
      <p class="h2">@@title</p>
      <p class="description">@@description</p>
      <div class="additionaContent">@@additionaContent</div>
    </div>
    <div class="image-container">
      <picture>
        <source srcset="@@imageWebpURL" type="image/webp">
        <img class="client-image" src="@@imageURL" alt="Image" width="@@imageWidth" height="@@imageHeight" />
      </picture>
    </div>
  </div>
</section>

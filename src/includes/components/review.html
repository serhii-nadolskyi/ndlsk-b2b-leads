<!-- Review -->
<div class="review">
  <!-- Avatar -->
  <div class="review__avatar">
    <img class="review_image" src="@@avatarURL" alt="User Avatar" width="100" height="100" />
  </div>
  <!-- Text -->
  <div class="review__container">
    <p class="review_text">@@text</p>
    <p class="review_author">@@author</p>
    <p class="review_position">@@position</p>
  </div>
</div>
